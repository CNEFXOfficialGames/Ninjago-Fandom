<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fan Page</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #111, #1a1a1a);
      color: white;
      text-align: center;
    }

    header {
      padding: 40px;
      background: #d40000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    h1 {
      margin: 0;
      font-size: 40px;
    }

    .container {
      padding: 30px;
    }

    .card {
      background: #222;
      margin: 20px auto;
      padding: 20px;
      max-width: 600px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255,0,0,0.3);
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: red;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: darkred;
    }
  </style>
</head>

<body>

  <header>
    <h1>🔥 Fan Page</h1>
    <p>Welcome to my fan website</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>About</h2>
      <p>This is a fan page made for my favourite show / game / movie.</p>
    </div>

    <div class="card">
      <h2>Updates</h2>
      <p>No updates yet... but stay tuned 👀</p>
    </div>

    <div class="card">
      <h2>Secret Button</h2>
      <button onclick="alert('You found a secret! 🔥')">Click me</button>
    </div>

  </div>

</body>
</html>
