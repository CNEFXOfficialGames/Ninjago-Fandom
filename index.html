<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninjago Training Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  background: black;
  overflow-x: hidden;
}

/* BACKGROUND */
.bg {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, #200000, #000);
  animation: glow 5s infinite alternate;
  z-index: -2;
}

@keyframes glow {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(60deg); }
}

/* HEADER */
header {
  text-align: center;
  padding: 50px 20px;
  background: linear-gradient(90deg, #ff0000, #000);
  box-shadow: 0 0 25px red;
}

header h1 {
  margin: 0;
  font-size: 42px;
}

/* HUD */
.hud {
  display: flex;
  justify-content: space-around;
  padding: 15px;
  background: #111;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #333;
}

.bar {
  width: 200px;
  height: 15px;
  background: #222;
  border-radius: 10px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 0%;
  background: red;
  transition: 0.3s;
}

/* GRID */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}

.card {
  background: #1a1a1a;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #333;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px red;
}

/* BUTTON */
button {
  padding: 10px 15px;
  background: red;
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: darkred;
}

/* TEXT */
#msg {
  margin-top: 10px;
  color: lime;
}

footer {
  text-align: center;
  opacity: 0.5;
  padding: 20px;
}
</style>
</head>

<body>

<div class="bg"></div>

<header>
  <h1>🐉 NINJAGO TRAINING HUB</h1>
  <p>Become a Master of Spinjitzu</p>
</header>

<!-- HUD -->
<div class="hud">
  <div>
    Power Level: <span id="level">1</span>
  </div>

  <div class="bar">
    <div class="fill" id="xp"></div>
  </div>

  <div id="rank">Rookie Ninja</div>
</div>

<div class="container">

<!-- NINJAS -->
<h2>⚡ Choose Your Ninja</h2>
<div class="grid">

  <div class="card" onclick="select('Kai 🔥')">Kai</div>
  <div class="card" onclick="select('Jay ⚡')">Jay</div>
  <div class="card" onclick="select('Cole ⛰️')">Cole</div>
  <div class="card" onclick="select('Zane ❄️')">Zane</div>
  <div class="card" onclick="select('Nya 🌊')">Nya</div>
  <div class="card" onclick="select('Lloyd 🟢')">Lloyd</div>

</div>

<p id="selected">No ninja selected</p>

<hr>

<!-- TRAINING -->
<h2>🌀 Training Actions</h2>
<button onclick="train()">Train Spinjitzu</button>
<button onclick="train()">Element Attack</button>
<button onclick="train()">Focus Energy</button>

<p id="msg"></p>

</div>

<footer>
Made by a rising ninja 🐉🔥
</footer>

<script>

let xp = 0;
let level = 1;

function select(name) {
  document.getElementById("selected").innerText =
    "Selected: " + name + " 🐉";
}

function train() {
  xp += 20;

  if (xp >= 100) {
    level++;
    xp = 0;
  }

  document.getElementById("xp").style.width = xp + "%";
  document.getElementById("level").innerText = level;

  let rank = "Rookie Ninja";
  if (level >= 2) rank = "Apprentice Ninja";
  if (level >= 4) rank = "Master of Spinjitzu";
  if (level >= 6) rank = "Golden Ninja";

  document.getElementById("rank").innerText = rank;

  document.getElementById("msg").innerText =
    "Training successful ⚡ +XP gained!";
}

</script>

</body>
</html>
